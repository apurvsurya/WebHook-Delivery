<div class="min-h-screen bg-[#090b14] text-white flex">

  <aside class="sidebar w-60 shrink-0 border-r border-white/[0.07] flex flex-col relative overflow-hidden">

    <!-- Branding -->
    <div class="h-[76px] px-6 flex items-center gap-3 border-b border-white/[0.06] relative z-10">
      <div class="text-3xl text-blue-400">ϟ</div>

      <div>
        <h1 class="font-bold text-lg tracking-tight">Webhook Hub</h1>
        <p class="text-[11px] text-slate-400">Events in. Delivered. ✨</p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="px-3 pt-6 space-y-2 relative z-10">
      @for (item of navItems; track item.route) {
      <a  [routerLink]="item.route" routerLinkActive="nav-active" 
        class="nav-item flex items-center gap-4 px-4 py-3 rounded-xl text-sm text-slate-300 transition-all">
        <span class="text-xl w-4 text-center">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
      }
    </nav>

  
    <div class="sidebar-art"></div>

  </aside>

  
  <div class="flex-1 min-w-0 flex flex-col min-h-screen">

    
    <header class="topbar h-[76px] shrink-0 border-b border-white/[0.07] px-8 flex items-center justify-between gap-6">
      <div class="search-box flex items-center gap-3 px-4 h-10 rounded-xl w-full max-w-[430px]">
        <span class="text-slate-400 text-lg">⌕</span>
        <input type="text" /* [(ngModel)]="searchText" */ placeholder="Search events, destinations..."
          class="bg-transparent outline-none text-sm w-full text-white placeholder:text-slate-500" />
        <span class="text-xs text-slate-500 border border-white/10 rounded px-2 py-1">
          ⌘ K
        </span>
      </div>

      <div class="flex items-center gap-6 shrink-0">

        <button class="relative text-slate-300 hover:text-white text-xl">
          ♧
          <span class="absolute top-0 right-0 w-2 h-2 bg-rose-500 rounded-full"></span>
        </button>

        <button class="flex items-center gap-3">
          <div
            class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-violet-500 flex items-center justify-center text-sm font-semibold shadow-lg shadow-violet-500/20">
            {{userInitials()}}
          </div>

          <span class="text-sm hidden sm:block">{{currentUser()?.name}}</span>
          <span class="text-slate-400 text-xs">⌄</span>
        </button>

      </div>
    </header>

    <main class="flex-1 px-8 py-7">

      <router-outlet></router-outlet>

    </main>

    <!-- FOOTER -->
    <footer
      class="app-footer mx-8 border-t border-white/[0.07] py-5 flex flex-wrap items-center justify-between gap-4 text-xs text-slate-500">

      <div class="flex items-center gap-2">
        <span class="text-slate-400">ϟ</span>
        <span>Webhook Hub</span>
        <span class="text-slate-700">·</span>
        <span>Built for reliable delivery.</span>
      </div>

      <div class="flex items-center gap-5">

        <div class="flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span>System operational</span>
        </div>

        <span class="text-slate-700">|</span>

        <div class="flex items-center gap-4">
          <!-- LinkedIn -->
          <a href="https://www.linkedin.com/in/YOUR_USERNAME/" target="_blank" rel="noopener noreferrer"
            aria-label="LinkedIn" title="LinkedIn"
            class="text-slate-500 hover:text-[#0A66C2] transition-colors duration-200">
            <lucide-icon [img]="Linkedin" class="w-4 h-4"></lucide-icon>
          </a>

          <!-- Instagram -->
          <a href="https://www.linkedin.com/in/apurva-surya-4b01a6277/" target="_blank" rel="noopener noreferrer"
            aria-label="Instagram" title="Instagram"
            class="text-slate-500 hover:text-[#E4405F] transition-colors duration-200">
            <lucide-icon [img]="Instagram" class="w-4 h-4"></lucide-icon>
          </a>
        </div>
      </div>

    </footer>

  </div>
</div>
